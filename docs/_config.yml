title: "Agent Academy Recruit Course"
description: "Build production-ready AI agents with Microsoft Copilot Studio — updated for the June 2026 UI."
baseurl: "/BOOST"
url: "https://ulrikkerocks.github.io"

# Theme: Just the Docs via remote_theme (supported on GitHub Pages)
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Process every page with the Just the Docs default layout
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Light color scheme, like the original
color_scheme: light

# Built-in client-side search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true

# Top-right auxiliary links
aux_links:
  "View on GitHub":
    - "https://github.com/ulrikkerocks/BOOST"
aux_links_new_tab: true

# UI niceties
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Footer
footer_content: 'Copyright &copy; 2026 Ulrikke Rocks · Adapted from the <a href="https://microsoft.github.io/agent-academy/recruit/">Microsoft Agent Academy</a> (MIT).'

# Exclude from processing
exclude:
  - screenshot-audit-checklist.md
  - screenshot-capture-plan.md
  - .copilot/
  - assets/presentation/
